# Один хост: docker compose up -d
# Swarm:     docker stack deploy -c docker-compose.yml tgstack

services:
  redis:
    image: redis:8.4.0
    container_name: redis
    command: redis-server
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - device_environment
      - mongo_mongo
    restart: unless-stopped

  mongo_primary:
    image: mongo:8.2.3
    container_name: mongo_primary
    command: mongod --replSet rs0 --bind_ip_all
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    ports:
      - "27017:27017"
    volumes:
      - mongo_primary_data:/data/db
    networks:
      - device_environment
      - mongo_mongo
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    restart: unless-stopped

  mongo_secondary:
    image: mongo:8.2.3
    container_name: mongo_secondary
    command: mongod --replSet rs0 --bind_ip_all
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    volumes:
      - mongo_secondary_data:/data/db
    networks:
      - device_environment
      - mongo_mongo
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - device_environment
    restart: unless-stopped

volumes:
  redis_data:
  mongo_primary_data:
  mongo_secondary_data:

networks:
  device_environment:
    attachable: true
  mongo_mongo:
    attachable: true
